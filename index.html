<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Micro Racers</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #2a1d12; height: 100%; }
  canvas { display: block; }
  * { touch-action: none; -webkit-user-select: none; user-select: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

// ---------------------------------------------------------------------------
// Micro Racers — a tiny top-down Micro Machines style racer.
// Single file, no dependencies. Arrows/WASD to drive, Space = handbrake,
// R = restart, N = track menu, P = pause. 3 laps against three AI toy cars.
// Tracks: a kitchen table, and a mini golf course with ramps, water,
// sand traps and a windmill.
// ---------------------------------------------------------------------------

// Surface any startup crash instead of a silent black screen.
window.onerror = function (msg, src, line) {
  let el = document.getElementById("err");
  if (!el) {
    el = document.createElement("div");
    el.id = "err";
    el.style.cssText = "position:fixed;top:8px;left:8px;right:8px;z-index:9;color:#fff;background:rgba(180,30,30,.92);font:14px monospace;padding:10px;border-radius:8px;white-space:pre-wrap;";
    document.body.appendChild(el);
  }
  el.textContent += msg + " @" + line + "\n";
};

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1;
function viewSize() {
  // innerWidth can be 0 inside embedded viewers before layout settles
  const vv = window.visualViewport;
  return [
    Math.max(window.innerWidth, vv ? vv.width : 0, document.documentElement.clientWidth || 0),
    Math.max(window.innerHeight, vv ? vv.height : 0, document.documentElement.clientHeight || 0),
  ];
}
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  [W, H] = viewSize();
  canvas.width = Math.max(1, W * DPR); canvas.height = Math.max(1, H * DPR);
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
}
window.addEventListener("resize", resize);
resize();

const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
function angDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d < -Math.PI) d += 2 * Math.PI;
  return d;
}

// ----- Track definitions -----------------------------------------------------
const WORLD_W = 2600, WORLD_H = 1850;
const HALF_W = 92;                    // road half-width

const TRACKS = [
  {
    name: "Kitchen Table",
    blurb: "wood, coins & coffee stains",
    pts: [
      [350,1450],[850,1520],[1400,1500],[1900,1450],[2250,1250],[2300,950],
      [2150,700],[1850,600],[1600,700],[1500,950],[1300,1100],[1050,1050],
      [950,800],[1050,550],[900,350],[600,300],[350,450],[250,750],[250,1100]
    ],
    theme: drawKitchenWorld,
    hazards: () => ({ sands: [], waters: [], ramps: [], windmills: [] }),
  },
  {
    name: "Mini Golf",
    blurb: "ramps · water · sand · windmill",
    pts: [
      [300,1500],[800,1550],[1350,1550],[1900,1500],[2300,1300],[2350,1000],
      [2200,750],[1950,650],[1700,750],[1650,1000],[1450,1150],[1200,1150],
      [1000,1000],[950,750],[1100,500],[900,300],[550,300],[300,500],
      [220,900],[230,1250]
    ],
    theme: drawGolfWorld,
    hazards: (track) => {
      // windmill sits at the fairway edge on the left climb
      const wi = nearestSampleOf(track.samples, 950, 750);
      const ws = track.samples[wi];
      // sand traps clip the outer edge of corners: they catch wide lines,
      // not cars on the racing line
      const edge = (ax, ay, r) => {
        const s = track.samples[nearestSampleOf(track.samples, ax, ay)];
        const d = HALF_W + r * 0.55;
        const cA = { x: s.x - s.dy * d, y: s.y + s.dx * d, r };
        const cB = { x: s.x + s.dy * d, y: s.y - s.dx * d, r };
        const cx = 1300, cy = 950;   // rough course centre
        return ((cA.x - cx) ** 2 + (cA.y - cy) ** 2 > (cB.x - cx) ** 2 + (cB.y - cy) ** 2) ? cA : cB;
      };
      return {
        sands: [
          edge(2330, 1150, 90),
          edge(1080, 460, 85),
          edge(280, 1330, 80),
          edge(1550, 1120, 75),
        ],
        waters: [
          { kind: "rect", x: 1275, y: 1400, w: 120, h: 300 },   // the carry
          { kind: "circle", x: 2000, y: 1050, r: 135 },          // infield pond
        ],
        ramps: [
          { x: 1150, y: 1430, w: 95, h: 235, dx: 1, dy: 0 },
        ],
        windmills: [
          { x: ws.x - ws.dy * 85, y: ws.y + ws.dx * 85,
            len: 150, hubR: 24, armW: 16, ang: 0, om: 1.0 },
        ],
      };
    },
  },
  {
    name: "Backyard Machine",
    blurb: "dominoes · bowling ball · sprinkler chaos",
    pts: [
      [350,1500],[900,1560],[1450,1540],[1950,1480],[2300,1280],[2380,980],
      [2250,700],[1950,560],[1650,620],[1520,850],[1350,1050],[1100,1120],
      [850,1000],[800,750],[950,520],[750,330],[450,350],[280,550],
      [200,850],[230,1200]
    ],
    theme: drawYardWorld,
    hazards: () => {
      // the Rube Goldberg chain: pad -> dominoes -> seesaw -> bowling ball
      // across the track -> kiddie pool splash -> sprinkler (buried pipe)
      const dominoes = [];
      for (let i = 0; i < 14; i++) {
        const t = i / 13;
        const x = 1010 + (1290 - 1010) * t, y = 1430 + (1330 - 1430) * t;
        const bx = Math.sin(t * Math.PI) * 28;   // gentle arc bulge
        dominoes.push({ x: x - bx * 0.34, y: y - bx, ang: Math.atan2(-100, 280) });
      }
      return {
        sands: [
          { x: 2430, y: 1350, r: 85 },   // sandbox
          { x: 590,  y: 215,  r: 90 },   // flower bed
        ],
        waters: [
          { kind: "circle", x: 1318, y: 1722, r: 72 },   // kiddie pool
        ],
        ramps: [],
        windmills: [],
        bumps: [
          { x: 2240, y: 818, w: 210, h: 36 },   // garden hose across the track
        ],
        machine: {
          state: "armed", t: 0,
          pad: { x: 860, y: 1470, w: 120, h: 180 },
          dominoes,
          seesaw: { x: 1330, y: 1310 },
          ballLand: { x: 1318, y: 1430 },
          ballEnd:  { x: 1318, y: 1675 },
          pool: { x: 1318, y: 1722, r: 72 },
          spr: { x: 945, y: 890, r: 160, ang: 0 },
        },
      };
    },
  },
];

// Rube Goldberg timeline (seconds after the pad is hit)
const MT = {
  dom0: 0.4, domDt: 0.13,      // first domino, per-domino delay
  seesaw: 2.3,                  // seesaw tips
  launch: 2.55, land: 3.35,     // ball flight
  splash: 4.85,                 // ball reaches the pool
  sprOn: 5.2, sprOff: 9.2,      // sprinkler burst
  reset: 9.4, armed: 11.2,      // everything winds back up
};
function sprinklerOn(M) { return M.state === "run" && M.t > MT.sprOn && M.t < MT.sprOff; }

function nearestSampleOf(samples, x, y) {
  let best = 0, bd = Infinity;
  for (let i = 0; i < samples.length; i++) {
    const s = samples[i];
    const d = (x - s.x) * (x - s.x) + (y - s.y) * (y - s.y);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

// Sample a closed Catmull-Rom spline through the control points.
function buildSamples(pts) {
  const samples = [];
  const n = pts.length, steps = 14;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i];
    const p2 = pts[(i + 1) % n],     p3 = pts[(i + 2) % n];
    for (let s = 0; s < steps; s++) {
      const t = s / steps, t2 = t * t, t3 = t2 * t;
      const x = 0.5 * ((2*p1[0]) + (-p0[0]+p2[0])*t + (2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2 + (-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3);
      const y = 0.5 * ((2*p1[1]) + (-p0[1]+p2[1])*t + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 + (-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3);
      samples.push({ x, y, dx: 0, dy: 0, cum: 0 });
    }
  }
  const N = samples.length;
  let cum = 0;
  for (let i = 0; i < N; i++) {
    const a = samples[i], b = samples[(i + 1) % N];
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
    a.dx = dx / len; a.dy = dy / len;
    a.cum = cum; cum += len;
  }
  samples.totalLen = cum;
  return samples;
}

// Current track state (reassigned by loadTrack)
let curTrack = 0;
let SAMPLES = null, N_S = 0, world = null, HZ = null;

function loadTrack(i) {
  curTrack = i;
  const def = TRACKS[i];
  if (!def.samples) def.samples = buildSamples(def.pts);
  SAMPLES = def.samples; N_S = SAMPLES.length;
  if (!def.hz) def.hz = def.hazards(def);
  HZ = def.hz;
  if (!def.world) {
    def.world = document.createElement("canvas");
    def.world.width = WORLD_W; def.world.height = WORLD_H;
    def.theme(def.world.getContext("2d"), def);
  }
  world = def.world;
}

function nearestSample(x, y, hint) {
  let best = hint, bd = Infinity;
  for (let k = hint - 45; k < hint + 45; k++) {
    const i = ((k % N_S) + N_S) % N_S;
    const s = SAMPLES[i];
    const d = (x - s.x) * (x - s.x) + (y - s.y) * (y - s.y);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

// ----- Hazard queries ---------------------------------------------------------
function inWater(x, y) {
  for (const w of HZ.waters) {
    if (w.kind === "rect") {
      if (x >= w.x && x <= w.x + w.w && y >= w.y && y <= w.y + w.h) return true;
    } else if ((x - w.x) ** 2 + (y - w.y) ** 2 < w.r * w.r) return true;
  }
  return false;
}
function inSand(x, y) {
  for (const s of HZ.sands) {
    if ((x - s.x) ** 2 + (y - s.y) ** 2 < s.r * s.r) return true;
  }
  return false;
}
function rampAt(x, y) {
  for (const r of HZ.ramps) {
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r;
  }
  return null;
}
// walk backwards along the track to a spot that isn't wet, plus a run-up
function findSafeSample(si) {
  let idx = si;
  for (let k = 0; k < N_S; k++) {
    const s = SAMPLES[idx];
    if (!inWater(s.x, s.y)) break;
    idx = (idx - 1 + N_S) % N_S;
  }
  return (idx - 14 + N_S) % N_S;
}

// ----- World themes -------------------------------------------------------------
function tracePath(g, samples) {
  const p = new Path2D();
  p.moveTo(samples[0].x, samples[0].y);
  for (let i = 1; i < samples.length; i++) p.lineTo(samples[i].x, samples[i].y);
  p.closePath();
  return p;
}
function drawCheckers(g, s0) {
  const nx = -s0.dy, ny = s0.dx, cell = 15;
  for (let row = 0; row < 2; row++) {
    for (let c = -6; c < 6; c++) {
      g.fillStyle = ((row + c) % 2 === 0) ? "#111" : "#eee";
      g.save();
      g.translate(s0.x + s0.dx * row * cell + nx * c * cell,
                  s0.y + s0.dy * row * cell + ny * c * cell);
      g.rotate(Math.atan2(s0.dy, s0.dx));
      g.fillRect(0, 0, cell, cell);
      g.restore();
    }
  }
}

function drawKitchenWorld(g, track) {
  const samples = track.samples, N = samples.length;
  // Wooden table planks
  const plankH = 132;
  for (let y = 0; y < WORLD_H; y += plankH) {
    const l = 46 + ((y / plankH * 7) % 9);
    g.fillStyle = `hsl(28, 42%, ${l}%)`;
    g.fillRect(0, y, WORLD_W, plankH);
    g.strokeStyle = "rgba(70,40,15,0.10)";
    g.lineWidth = 1.5;
    for (let i = 0; i < 26; i++) {
      const gy = y + 8 + Math.random() * (plankH - 16);
      g.beginPath();
      g.moveTo(0, gy);
      for (let x = 0; x < WORLD_W; x += 90) g.lineTo(x + 90, gy + Math.sin(x * 0.01 + gy) * 4);
      g.stroke();
    }
    g.strokeStyle = "rgba(40,20,5,0.35)";
    g.lineWidth = 3;
    g.beginPath(); g.moveTo(0, y); g.lineTo(WORLD_W, y); g.stroke();
  }
  // coffee ring stains
  g.strokeStyle = "rgba(90,45,10,0.22)"; g.lineWidth = 16;
  for (const [cx, cy, r] of [[1720, 980, 105], [2420, 1650, 80], [180, 190, 90]]) {
    g.beginPath(); g.arc(cx, cy, r, 0, 7); g.stroke();
  }
  // pencil
  g.save();
  g.translate(2470, 480); g.rotate(1.35);
  g.fillStyle = "#e8b23c"; g.fillRect(-250, -11, 460, 22);
  g.fillStyle = "#f5d9a8"; g.beginPath(); g.moveTo(210, -11); g.lineTo(265, 0); g.lineTo(210, 11); g.fill();
  g.fillStyle = "#333"; g.beginPath(); g.moveTo(248, -3.5); g.lineTo(265, 0); g.lineTo(248, 3.5); g.fill();
  g.fillStyle = "#e77"; g.fillRect(-275, -11, 25, 22);
  g.fillStyle = "#aaa"; g.fillRect(-252, -11, 14, 22);
  g.restore();
  // sticky note
  g.save();
  g.translate(660, 130); g.rotate(-0.12);
  g.fillStyle = "rgba(0,0,0,0.15)"; g.fillRect(-72, -66, 150, 150);
  g.fillStyle = "#f7e96b"; g.fillRect(-75, -70, 150, 150);
  g.fillStyle = "#7a6a10"; g.font = "bold 34px Comic Sans MS, cursive";
  g.textAlign = "center"; g.fillText("GO", 0, -10); g.fillText("FAST!", 0, 35);
  g.restore();
  // coins
  for (const [cx, cy] of [[2340, 240], [140, 1700]]) {
    g.fillStyle = "#c9982f"; g.beginPath(); g.arc(cx, cy, 44, 0, 7); g.fill();
    g.fillStyle = "#e3b84d"; g.beginPath(); g.arc(cx, cy, 37, 0, 7); g.fill();
    g.strokeStyle = "#b3872a"; g.lineWidth = 3;
    g.beginPath(); g.arc(cx, cy, 30, 0, 7); g.stroke();
    g.fillStyle = "#b3872a"; g.font = "bold 40px serif"; g.textAlign = "center";
    g.fillText("1", cx, cy + 14);
  }
  // Track: dark border, asphalt, curbs, center dashes
  const path = tracePath(g, samples);
  g.lineJoin = "round"; g.lineCap = "round";
  g.strokeStyle = "rgba(0,0,0,0.30)"; g.lineWidth = HALF_W * 2 + 26; g.stroke(path);
  g.strokeStyle = "#3f4045"; g.lineWidth = HALF_W * 2 + 14; g.stroke(path);
  g.strokeStyle = "#57585e"; g.lineWidth = HALF_W * 2; g.stroke(path);
  for (let i = 0; i < N; i += 2) {
    const s = samples[i], nx = -s.dy, ny = s.dx;
    for (const side of [-1, 1]) {
      g.save();
      g.translate(s.x + nx * side * HALF_W, s.y + ny * side * HALF_W);
      g.rotate(Math.atan2(s.dy, s.dx));
      g.fillStyle = (i % 4 === 0) ? "#d94141" : "#f0f0f0";
      g.fillRect(-12, -5, 24, 10);
      g.restore();
    }
  }
  g.strokeStyle = "rgba(255,255,255,0.55)"; g.lineWidth = 4;
  g.setLineDash([26, 22]); g.stroke(path); g.setLineDash([]);
  drawCheckers(g, samples[0]);
}

function drawGolfWorld(g, track) {
  const samples = track.samples, hz = track.hz || track.hazards(track);
  track.hz = hz;
  // mottled felt rough
  g.fillStyle = "#8cbb6d";
  g.fillRect(0, 0, WORLD_W, WORLD_H);
  for (let i = 0; i < 520; i++) {
    g.fillStyle = Math.random() < 0.5 ? "rgba(110,150,80,0.18)" : "rgba(160,200,120,0.14)";
    const r = 15 + Math.random() * 55;
    g.beginPath();
    g.arc(Math.random() * WORLD_W, Math.random() * WORLD_H, r, 0, 7);
    g.fill();
  }
  // wooden deck border around the course
  g.strokeStyle = "#6b4a2a"; g.lineWidth = 26;
  g.strokeRect(13, 13, WORLD_W - 26, WORLD_H - 26);
  g.strokeStyle = "rgba(0,0,0,0.25)"; g.lineWidth = 3;
  g.strokeRect(28, 28, WORLD_W - 56, WORLD_H - 56);

  // giant golf ball prop
  g.fillStyle = "rgba(0,0,0,0.18)";
  g.beginPath(); g.ellipse(628, 668, 68, 60, 0, 0, 7); g.fill();
  g.fillStyle = "#f4f4f0";
  g.beginPath(); g.arc(620, 650, 66, 0, 7); g.fill();
  g.fillStyle = "rgba(0,0,0,0.10)";
  for (let a = 0; a < 20; a++) {
    const ang = a * 1.9, rr = 12 + (a * 13) % 46;
    g.beginPath(); g.arc(620 + Math.cos(ang) * rr, 650 + Math.sin(ang) * rr, 4, 0, 7); g.fill();
  }
  // decorative putting cup with flag
  g.fillStyle = "#1e4d28";
  g.beginPath(); g.ellipse(2450, 330, 26, 14, 0, 0, 7); g.fill();
  g.strokeStyle = "#ddd"; g.lineWidth = 5;
  g.beginPath(); g.moveTo(2450, 330); g.lineTo(2450, 210); g.stroke();
  g.fillStyle = "#e33f3f";
  g.beginPath(); g.moveTo(2450, 210); g.lineTo(2515, 232); g.lineTo(2450, 254); g.fill();

  // fairway: wooden rails then green felt
  const path = tracePath(g, samples);
  g.lineJoin = "round"; g.lineCap = "round";
  g.strokeStyle = "rgba(0,0,0,0.28)"; g.lineWidth = HALF_W * 2 + 30; g.stroke(path);
  g.strokeStyle = "#7a5230"; g.lineWidth = HALF_W * 2 + 20; g.stroke(path);
  g.strokeStyle = "#3f8f52"; g.lineWidth = HALF_W * 2; g.stroke(path);
  g.strokeStyle = "rgba(255,255,255,0.22)"; g.lineWidth = 4;
  g.setLineDash([26, 26]); g.stroke(path); g.setLineDash([]);

  // sand traps
  for (const s of hz.sands) {
    g.fillStyle = "#b8a25f";
    g.beginPath(); g.arc(s.x + 4, s.y + 5, s.r, 0, 7); g.fill();
    g.fillStyle = "#e8d59a";
    g.beginPath(); g.arc(s.x, s.y, s.r, 0, 7); g.fill();
    g.fillStyle = "rgba(160,130,70,0.5)";
    for (let i = 0; i < s.r; i += 4) {
      const a = i * 2.4, rr = Math.sqrt(i / s.r) * (s.r - 6);
      g.beginPath(); g.arc(s.x + Math.cos(a) * rr, s.y + Math.sin(a) * rr, 1.6, 0, 7); g.fill();
    }
  }
  // water
  for (const w of hz.waters) {
    g.fillStyle = "#2f6ea8";
    if (w.kind === "rect") g.fillRect(w.x - 5, w.y - 5, w.w + 10, w.h + 10);
    else { g.beginPath(); g.arc(w.x, w.y, w.r + 5, 0, 7); g.fill(); }
    g.fillStyle = "#3f87cf";
    if (w.kind === "rect") g.fillRect(w.x, w.y, w.w, w.h);
    else { g.beginPath(); g.arc(w.x, w.y, w.r, 0, 7); g.fill(); }
    g.strokeStyle = "rgba(255,255,255,0.35)"; g.lineWidth = 3;
    for (let i = 0; i < 6; i++) {
      const rx = w.kind === "rect" ? w.x + (i * 37) % w.w : w.x + Math.cos(i * 2.1) * w.r * 0.55;
      const ry = w.kind === "rect" ? w.y + (i * 61) % w.h : w.y + Math.sin(i * 2.1) * w.r * 0.55;
      g.beginPath(); g.arc(rx, ry, 9 + (i % 3) * 5, 0.3, 2.6); g.stroke();
    }
  }
  // ramps: wooden wedge with chevrons
  for (const r of hz.ramps) {
    g.fillStyle = "#8a5f35"; g.fillRect(r.x, r.y, r.w, r.h);
    g.strokeStyle = "rgba(0,0,0,0.3)"; g.lineWidth = 2;
    for (let px = r.x + 12; px < r.x + r.w; px += 14) {
      g.beginPath(); g.moveTo(px, r.y); g.lineTo(px, r.y + r.h); g.stroke();
    }
    g.strokeStyle = "#fff"; g.lineWidth = 7; g.lineJoin = "miter";
    for (let cy = r.y + 40; cy < r.y + r.h - 20; cy += 60) {
      g.beginPath();
      g.moveTo(r.x + 18, cy - 16); g.lineTo(r.x + r.w - 22, cy); g.lineTo(r.x + 18, cy + 16);
      g.stroke();
    }
  }
  drawCheckers(g, samples[0]);
  // flag at the start line
  const s0 = samples[0];
  g.strokeStyle = "#eee"; g.lineWidth = 6;
  g.beginPath(); g.moveTo(s0.x - s0.dy * (HALF_W + 28), s0.y + s0.dx * (HALF_W + 28));
  g.lineTo(s0.x - s0.dy * (HALF_W + 28), s0.y + s0.dx * (HALF_W + 28) - 120); g.stroke();
  g.fillStyle = "#e33f3f";
  const fx = s0.x - s0.dy * (HALF_W + 28), fy = s0.y + s0.dx * (HALF_W + 28) - 120;
  g.beginPath(); g.moveTo(fx, fy); g.lineTo(fx + 62, fy + 20); g.lineTo(fx, fy + 40); g.fill();
}

function drawYardWorld(g, track) {
  const samples = track.samples, hz = track.hz || track.hazards(track);
  track.hz = hz;
  // mowed lawn with stripes
  g.fillStyle = "#79ad58";
  g.fillRect(0, 0, WORLD_W, WORLD_H);
  for (let y = 0; y < WORLD_H; y += 220) {
    g.fillStyle = "rgba(255,255,255,0.05)";

// ----- Cars ------------------------------------------------------------------
const ROSTER = [
  { name: "You",     color: "#e33f3f", roof: "#f5807f", ai: false, top: 1.00 },
  { name: "Turbo",   color: "#3f7de3", roof: "#7fabf5", ai: true,  top: 0.985 },
  { name: "Zippy",   color: "#3fc069", roof: "#83e0a4", ai: true,  top: 0.955 },
  { name: "Bruiser", color: "#e3a63f", roof: "#f5cf82", ai: true,  top: 0.925 },
];

// AI difficulty: speed = straight-line pace, corner/cmin = how much speed
// they carry through bends, band = max rubber-band boost, line = how far
// they stray from the ideal racing line
const DIFFS = [
  { name: "EASY",   speed: 0.94, corner: 1.10, cmin: 0.26, band: 1.04, line: 1.0 },
  { name: "MEDIUM", speed: 1.00, corner: 1.18, cmin: 0.28, band: 1.10, line: 1.0 },
  { name: "HARD",   speed: 1.05, corner: 1.30, cmin: 0.36, band: 1.14, line: 0.4 },
];
let difficulty = 1;
try {
  const v = parseInt(localStorage.getItem("microRacersDiff"), 10);
  if (!Number.isNaN(v)) difficulty = clamp(v, 0, DIFFS.length - 1);
} catch (e) {}
function setDifficulty(d) {
  difficulty = d;
  try { localStorage.setItem("microRacersDiff", String(d)); } catch (e) {}
}
const MAX_V = 810;        // ≈ accel / forward drag
const AIR_TIME = 0.55;
let cars = [];
let splashes = [];

function makeCars() {
  cars = ROSTER.map((r, i) => {
    const back = 8 + Math.floor(i / 2) * 12;              // grid rows
    const side = (i % 2 === 0 ? -1 : 1) * 34;             // grid columns
    const si = (N_S - back) % N_S;
    const s = SAMPLES[si];
    const nx = -s.dy, ny = s.dx;
    return {
      ...r,
      x: s.x + nx * side, y: s.y + ny * side,
      angle: Math.atan2(s.dy, s.dx),
      vx: 0, vy: 0, si,
      lap: 0, finished: false, finishTime: 0,
      respawn: 0, air: 0, aiOffset: (Math.random() - 0.5) * 44,
      progress: 0,
    };
  });
}

function updateCar(car, dt, throttle, steer, handbrake) {
  if (car.air > 0) {
    // flying: keep velocity, no grip, no steering
    car.air -= dt;
    car.x += car.vx * dt; car.y += car.vy * dt;
  } else {
    const fx = Math.cos(car.angle), fy = Math.sin(car.angle);
    const nx = -fy, ny = fx;
    const s = SAMPLES[car.si];
    const off = Math.hypot(car.x - s.x, car.y - s.y) > HALF_W;
    const sand = inSand(car.x, car.y);
    // sprinkler spray = soaked grass = no grip
    let slippery = false;
    const M = HZ.machine;
    if (M && sprinklerOn(M) &&
        (car.x - M.spr.x) ** 2 + (car.y - M.spr.y) ** 2 < M.spr.r * M.spr.r) slippery = true;
    // thrust: sand is worse than rough
    const fwdAcc = sand ? 180 : (off ? 270 : 570);
    const acc = throttle > 0 ? throttle * fwdAcc : throttle * 340;
    car.vx += fx * acc * dt; car.vy += fy * acc * dt;
    let f = car.vx * fx + car.vy * fy;
    let l = car.vx * nx + car.vy * ny;
    const fwdDamp = slippery ? 0.5 : (sand ? 4.2 : (off ? 2.4 : 0.7));
    const latDamp = slippery ? 0.9 : (handbrake ? 1.7 : (off || sand ? 4.0 : 8.0));
    f *= Math.exp(-fwdDamp * dt);
    l *= Math.exp(-latDamp * dt);
    car.vx = fx * f + nx * l; car.vy = fy * f + ny * l;
    const spdFactor = clamp(Math.abs(f) / 130, 0, 1);
    car.angle += steer * 4.1 * spdFactor * Math.sign(f || 1) * dt;
    car.x += car.vx * dt; car.y += car.vy * dt;

    // ramp launch (must be moving with the ramp)
    const ramp = rampAt(car.x, car.y);
    if (ramp && car.vx * ramp.dx + car.vy * ramp.dy > 140) {
      car.air = AIR_TIME;
      car.vx *= 1.12; car.vy *= 1.12;
      if (!car.ai) beep(520, 0.12);
    }
    // small bumps (garden hose): a quick hop, no boost
    for (const bmp of (HZ.bumps || [])) {
      if (car.x >= bmp.x && car.x <= bmp.x + bmp.w &&
          car.y >= bmp.y && car.y <= bmp.y + bmp.h &&
          Math.hypot(car.vx, car.vy) > 200) {
        car.air = 0.22;
        break;
      }
    }
    // water: splash + hand of god
    if (car.respawn <= 0 && car.air <= 0 && inWater(car.x, car.y)) {
      splashes.push({ x: car.x, y: car.y, t: 0.5 });
      if (!car.ai) beep(180, 0.25);
      car.respawn = 0.7;
      car.wet = true;
    }
  }
  car.x = clamp(car.x, 20, WORLD_W - 20);
  car.y = clamp(car.y, 20, WORLD_H - 20);

  // progress + laps
  const prev = car.si;
  car.si = nearestSample(car.x, car.y, car.si);
  if (prev > N_S * 0.9 && car.si < N_S * 0.1) car.lap++;
  else if (prev < N_S * 0.1 && car.si > N_S * 0.9) car.lap--;
  car.progress = car.lap * SAMPLES.totalLen + SAMPLES[car.si].cum;
  if (!car.finished && car.lap >= 4) {
    car.finished = true;
    car.finishTime = raceTime;
    finishOrder.push(car);
  }
  // wandered too far off the fairway? back on track you go
  const sNow = SAMPLES[car.si];
  if (car.air <= 0 && car.respawn <= 0 &&
      Math.hypot(car.x - sNow.x, car.y - sNow.y) > HALF_W * 1.9) {
    car.respawn = 0.7;
  }
  if (car.respawn > 0) {
    car.respawn -= dt;
    if (car.respawn <= 0.35 && car.respawn + dt > 0.35) {
      const idx = car.wet ? findSafeSample(car.si) : car.si;
      const sp = SAMPLES[idx];
      car.x = sp.x; car.y = sp.y;
      car.angle = Math.atan2(sp.dy, sp.dx);
      car.vx = car.vy = 0; car.wet = false; car.air = 0;
      car.si = idx;
    }
  }
}

function aiControls(car) {
  const D = DIFFS[difficulty];
  const f = car.vx * Math.cos(car.angle) + car.vy * Math.sin(car.angle);
  const look = Math.floor(6 + f * 0.022);
  const t = SAMPLES[(car.si + look) % N_S];
  const tn = { x: -t.dy, y: t.dx };
  const off = car.aiOffset * D.line;
  const tx = t.x + tn.x * off, ty = t.y + tn.y * off;
  const want = Math.atan2(ty - car.y, tx - car.x);
  const diff = angDiff(want, car.angle);
  const steer = clamp(diff * 3.0, -1, 1);
  const a1 = SAMPLES[(car.si + 6) % N_S], a2 = SAMPLES[(car.si + 20) % N_S];
  const sharp = Math.abs(angDiff(Math.atan2(a2.dy, a2.dx), Math.atan2(a1.dy, a1.dx)));
  const gap = cars[0].progress - car.progress;
  const band = clamp(1 + gap * 0.00005, 0.93, D.band);
  const desired = MAX_V * car.top * D.speed * band * clamp(D.corner - sharp * 1.85, D.cmin, 1);
  const throttle = f < desired ? 1 : (f - desired > 70 ? -0.55 : 0);
  return { throttle, steer, handbrake: false };
}

function collideCars() {
  const R = 15;
  for (let i = 0; i < cars.length; i++) {
    for (let j = i + 1; j < cars.length; j++) {
      const a = cars[i], b = cars[j];
      if (a.air > 0 || b.air > 0) continue;   // can't hit a flying car
      let dx = b.x - a.x, dy = b.y - a.y;
      let d = Math.hypot(dx, dy);
      if (d === 0) { dx = 1; d = 1; }
      if (d < R * 2) {
        const overlap = (R * 2 - d) / 2;
        const ux = dx / d, uy = dy / d;
        a.x -= ux * overlap; a.y -= uy * overlap;
        b.x += ux * overlap; b.y += uy * overlap;
        const rel = (b.vx - a.vx) * ux + (b.vy - a.vy) * uy;
        if (rel < 0) {
          const imp = -rel * 0.65;
          a.vx -= ux * imp; a.vy -= uy * imp;
          b.vx += ux * imp; b.vy += uy * imp;
        }
      }
    }
  }
}

function ballPos(M) {
  // returns {x, y, hop} during flight/roll phases, else null
  if (M.state !== "run") return null;
  if (M.t >= MT.launch && M.t < MT.land) {
    const p = (M.t - MT.launch) / (MT.land - MT.launch);
    return {
      x: M.seesaw.x + (M.ballLand.x - M.seesaw.x) * p,
      y: M.seesaw.y + (M.ballLand.y - M.seesaw.y) * p,
      hop: Math.sin(p * Math.PI),
    };
  }
  if (M.t >= MT.land && M.t < MT.splash) {
    const p = (M.t - MT.land) / (MT.splash - MT.land);
    return { x: M.ballLand.x, y: M.ballLand.y + (M.ballEnd.y - M.ballLand.y) * p, hop: 0 };
  }
  return null;
}

function updateMachine(dt) {
  const M = HZ.machine;
  if (!M) return;
  if (M.state === "armed") {
    for (const car of cars) {
      if (car.air <= 0 && car.respawn <= 0 &&
          car.x >= M.pad.x && car.x <= M.pad.x + M.pad.w &&
          car.y >= M.pad.y && car.y <= M.pad.y + M.pad.h) {
        M.state = "run"; M.t = 0;
        beep(700, 0.12);
        break;
      }
    }
    return;
  }
  const prevT = M.t;
  M.t += dt;
  if (sprinklerOn(M)) M.spr.ang += dt * 4;
  // clack per domino
  const di = Math.floor((M.t - MT.dom0) / MT.domDt);
  if (di >= 0 && di < M.dominoes.length && di !== Math.floor((prevT - MT.dom0) / MT.domDt)) beep(950 - di * 25, 0.04);
  if (prevT < MT.splash && M.t >= MT.splash) {
    splashes.push({ x: M.pool.x, y: M.pool.y, t: 0.5 });
    beep(180, 0.3);
  }
  // the rolling ball flattens anything in its way
  const b = ballPos(M);
  if (b && !b.hop) {
    for (const car of cars) {
      if (car.air > 0 || car.respawn > 0) continue;
      const dx = car.x - b.x, dy = car.y - b.y;
      const d = Math.hypot(dx, dy);
      if (d < 44) {
        car.vx = (dx / (d || 1)) * 200;
        car.vy = (dy / (d || 1)) * 140 + 240;   // shoved along the roll
        if (!car.ai) beep(120, 0.2);
      }
    }
  }
  if (M.t >= MT.armed) { M.state = "armed"; M.t = 0; }
}

function windmillHits(dt) {
  for (const w of HZ.windmills) {
    w.ang += w.om * dt;
    for (const car of cars) {
      if (car.air > 0 || car.respawn > 0) continue;
      const dx = car.x - w.x, dy = car.y - w.y;
      const r = Math.hypot(dx, dy);
      if (r < w.hubR + 13) {                       // solid hub: shove out
        const ux = dx / (r || 1), uy = dy / (r || 1);
        car.x = w.x + ux * (w.hubR + 14); car.y = w.y + uy * (w.hubR + 14);
        car.vx = ux * 120; car.vy = uy * 120;
      } else if (r < w.len + 8) {                  // rotating blades
        const phi = Math.atan2(dy, dx);
        for (let k = 0; k < 4; k++) {
          const a = w.ang + k * Math.PI / 2;
          if (Math.abs(angDiff(phi, a)) < Math.atan((w.armW / 2 + 11) / r)) {
            // batted along the blade's swing
            const tx = -Math.sin(a) * Math.sign(w.om), ty = Math.cos(a) * Math.sign(w.om);
            car.vx = tx * 260 + dx / r * 120;
            car.vy = ty * 260 + dy / r * 120;
            if (!car.ai) beep(140, 0.15);
            break;
          }
        }
      }
    }
  }
}

// Touch controls (only drawn on touch devices)
const IS_TOUCH = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
const touchState = { left: false, right: false, gas: false, brake: false };
function touchZones() {
  const s = Math.min(W, H) * 0.16, m = 18;
  return {
    left:  { x: m,             y: H - s - m, w: s, h: s, label: "◀" },
    right: { x: m + s + 14,    y: H - s - m, w: s, h: s, label: "▶" },
    brake: { x: W - 2*s - m-14,y: H - s - m, w: s, h: s, label: "▼" },
    gas:   { x: W - s - m,     y: H - s - m, w: s, h: s, label: "▲" },
  };
}
function handleTouches(e) {
  e.preventDefault();
  initAudio();
  if (e.type === "touchstart" && (state === "menu" || state === "done" || state === "board")) {
    const t = e.changedTouches[0];
    if (t && pointerDown(t.clientX, t.clientY)) return;
  }
  const z = touchZones();
  for (const k in touchState) touchState[k] = false;
  for (const t of e.touches) {
    for (const k in z) {
      const r = z[k];
      if (t.clientX >= r.x - 10 && t.clientX <= r.x + r.w + 10 &&
          t.clientY >= r.y - 10 && t.clientY <= r.y + r.h + 10) touchState[k] = true;
    }
  }
}
canvas.addEventListener("touchstart", handleTouches, { passive: false });
canvas.addEventListener("touchmove", handleTouches, { passive: false });
canvas.addEventListener("touchend", handleTouches, { passive: false });

// ----- Audio (tiny synth engine) ----------------------------------------------
let actx = null, engineOsc = null, engineGain = null;
function initAudio() {
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    engineOsc = actx.createOscillator();
    engineOsc.type = "sawtooth";
    const filt = actx.createBiquadFilter();
    filt.type = "lowpass"; filt.frequency.value = 500;
    engineGain = actx.createGain(); engineGain.gain.value = 0;
    engineOsc.connect(filt); filt.connect(engineGain); engineGain.connect(actx.destination);
    engineOsc.start();
  } catch (e) { actx = null; }
}
function beep(freq, dur) {
  if (!actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.08, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}

let lbCache = null;        // last board seen from the server {boards:{trackIdx:[...]}}
let lbOnline = false;
let lbSaving = false;

function lbLocal() {
  try { return JSON.parse(localStorage.getItem("microRacersLocal") || "{}"); } catch (e) { return {}; }
}
function lbSaveLocal(entry) {
  const all = lbLocal();
  const list = all[entry.track] || [];
  list.push(entry);
  list.sort((a, b) => a.t - b.t);
  all[entry.track] = list.slice(0, 10);
  try { localStorage.setItem("microRacersLocal", JSON.stringify(all)); } catch (e) {}
}
function lbBoards() {
  return (lbOnline || lbCache) && LB_URL ? ((lbCache && lbCache.boards) || {}) : lbLocal();
}

async function lbRequest(url, opts) {
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 7000);
  try { return await fetch(url, { ...opts, signal: ctrl.signal }); }
  finally { clearTimeout(to); }
}
async function lbFetch() {
  if (!LB_URL) return;
  try {
    const res = await lbRequest(LB_URL, { cache: "no-store" });
    if (res.status === 404) { lbCache = { v: 1, boards: {} }; lbOnline = true; return; }
    if (!res.ok) throw new Error(res.status);
    lbCache = await res.json();
    if (!lbCache || typeof lbCache !== "object" || !lbCache.boards) lbCache = { v: 1, boards: {} };
    lbOnline = true;
    try { localStorage.setItem("microRacersLB", JSON.stringify(lbCache)); } catch (e) {}
  } catch (e) { lbOnline = false; }
}
function lbQualifies(track, t) {
  const list = lbBoards()[track] || [];
  return list.length < 10 || t < list[list.length - 1].t;
}
async function lbSubmit(entry) {
  lbSaveLocal(entry);
  if (!LB_URL) return;
  lbSaving = true;
  try {
    await lbFetch();
    if (!lbOnline) throw new Error("offline");
    const boards = lbCache.boards;
    const list = boards[entry.track] || [];
    list.push({ n: entry.n, c: entry.c, t: entry.t, ts: entry.ts });
    list.sort((a, b) => a.t - b.t);
    boards[entry.track] = list.slice(0, 10);
    const opts = {
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(lbCache),
    };
    let res = await lbRequest(LB_URL, { ...opts, method: "PUT" });
    if (!res.ok) res = await lbRequest(LB_URL, { ...opts, method: "POST" });   // npoint et al
    if (!res.ok) throw new Error(res.status);
    try { localStorage.setItem("microRacersLB", JSON.stringify(lbCache)); } catch (e) {}
  } catch (e) { lbOnline = false; }
  lbSaving = false;
}

// --- one-time storage provisioning: open the game with #lbsetup ---
if (location.hash === "#lbsetup") {
  (async () => {
    const out = document.createElement("div");
    out.style.cssText = "position:fixed;inset:12px;z-index:20;background:#111;color:#7fe07f;" +
      "font-family:monospace;font-size:15px;padding:20px;border-radius:12px;overflow:auto;white-space:pre-wrap";
    document.body.appendChild(out);
    const log = s => { out.textContent += s + "\n"; };
    out.textContent = "Leaderboard storage setup\n=========================\n";
    const empty = JSON.stringify({ v: 1, boards: {} });

    // does a full round trip: create, then verify we can read AND write it
    async function verify(url) {
      const put = await fetch(url, { method: "PUT",
        headers: { "Content-Type": "application/json" }, body: empty });
      if (!put.ok) throw new Error("put " + put.status);
      const get = await fetch(url, { cache: "no-store" });
      if (!get.ok) throw new Error("get " + get.status);
      const j = await get.json();
      if (!j || !j.boards) throw new Error("readback mismatch");
      return url;
    }
    const providers = [
      ["kvdb.io", async () => {
        const res = await fetch("https://kvdb.io", { method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "email=microracers@example.com" });
        if (!res.ok) throw new Error("create " + res.status);
        const bucket = (await res.text()).trim();
        if (!/^[A-Za-z0-9]{10,}$/.test(bucket)) throw new Error("bad id: " + bucket.slice(0, 40));
        return verify(`https://kvdb.io/${bucket}/board`);
      }],
      ["extendsclass.com", async () => {
        const res = await fetch("https://extendsclass.com/api/json-storage/bin", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: empty });
        if (!res.ok) throw new Error("create " + res.status);
        const j = await res.json();
        if (!j.id) throw new Error("no id in " + JSON.stringify(j).slice(0, 60));
        return verify("https://extendsclass.com/api/json-storage/bin/" + j.id);
      }],
      ["jsonblob.com", async () => {
        const res = await fetch("https://jsonblob.com/api/jsonBlob", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: empty });
        if (!res.ok) throw new Error("create " + res.status);
        const loc = res.headers.get("Location") || res.headers.get("location");
        if (!loc) throw new Error("Location header not exposed");
        return verify(loc.startsWith("http") ? loc : "https://jsonblob.com" + loc);
      }],
    ];

    // connectivity probe so wifi blocks are distinguishable from broken providers
    try {
      const r = await fetch("https://api.github.com/zen", { cache: "no-store" });
      log("internet check (api.github.com): " + (r.ok ? "OK ✓" : "HTTP " + r.status));
    } catch (e) {
      log("internet check (api.github.com): FAILED — " + e.message);
      log("\nGeneral internet appears blocked (captive wifi?).");
      log("Re-open this page on normal internet and it should work.");
      return;
    }
    for (const [name, fn] of providers) {
      log("\ntrying " + name + " …");
      try {
        const url = await fn();
        log("read/write verified ✓");
        out.textContent += "\n✅ STORAGE CREATED\n\nSend this line back to Claude:\n\nLB_URL " + url + "\n";
        try { await navigator.clipboard.writeText("LB_URL " + url); log("(copied to clipboard)"); } catch (e) {}
        return;
      } catch (e) {
        log("✗ " + name + ": " + e.message);
      }
    }
    log("\n❌ All providers failed — likely blocked by this network.");
    log("Try again on normal wifi/cellular, or send Claude a screenshot.");
  })();
}

// ----- Race state ---------------------------------------------------------------
let state = "menu";       // menu | count | race | done
let stateT = 0, raceTime = 0, paused = false;
let finishOrder = [];
let lastBeep = -1;

function loadBest(i) {
  try { return parseFloat(localStorage.getItem("microRacersBest_" + i) || "0") || null; }
  catch (e) { return null; }
}
function saveBest(i, t) {
  try { localStorage.setItem("microRacersBest_" + i, String(t)); } catch (e) {}
}
const bestTimes = TRACKS.map((_, i) => loadBest(i));

function startRace(trackIdx) {
  loadTrack(trackIdx);
  makeCars();
  splashes = [];
  state = "count"; stateT = 0; raceTime = 0;
  finishOrder = []; lastBeep = -1; paused = false;
  entryHandled = false;
  cam.x = cars[0].x; cam.y = cars[0].y;
  lbFetch();   // freshen the board while we race
}

loadTrack(0);
makeCars();   // parked on the grid behind the menu
lbFetch();

// ----- Camera --------------------------------------------------------------------
const cam = { x: WORLD_W / 2, y: WORLD_H / 2, zoom: 1.1 };

// ----- Main loop --------------------------------------------------------------------
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const [vw2, vh2] = viewSize();
  if (vw2 !== W || vh2 !== H) resize();   // catches viewers that never fire resize
  let dt = Math.min((now - lastT) / 1000, 0.033);
  lastT = now;
  if (paused) dt = 0;

  stateT += dt;
  if (state === "count") {
    const n = 3 - Math.floor(stateT);
    if (n !== lastBeep && n >= 0) { beep(n === 0 ? 880 : 440, 0.18); lastBeep = n; }
    if (stateT >= 3) state = "race";
  }
  if (state === "race" || state === "done") raceTime += dt;

  const racing = state === "race" || state === "done";
  if (state !== "menu") {
    for (const car of cars) {
      let c = { throttle: 0, steer: 0, handbrake: false };
      if (racing && !car.finished && car.respawn <= 0) {
        if (car.ai) c = aiControls(car);
        else {
          const up = keys["arrowup"] || keys["w"] || touchState.gas;
          const dn = keys["arrowdown"] || keys["s"] || touchState.brake;
          const lf = keys["arrowleft"] || keys["a"] || touchState.left;
          const rt = keys["arrowright"] || keys["d"] || touchState.right;
          c.throttle = (up ? 1 : 0) + (dn ? -1 : 0);
          c.steer = (rt ? 1 : 0) - (lf ? 1 : 0);
          c.handbrake = !!keys[" "];
        }
      }
      if (car.finished && car.ai) c = { throttle: 0.15, steer: aiControls(car).steer, handbrake: false };
      updateCar(car, dt, c.throttle, c.steer, c.handbrake);
    }
    collideCars();
    windmillHits(dt);
    updateMachine(dt);

    if (state === "race" && cars[0].finished) {
      state = "done"; stateT = 0;
      if (!bestTimes[curTrack] || cars[0].finishTime < bestTimes[curTrack]) {
        bestTimes[curTrack] = cars[0].finishTime;
        saveBest(curTrack, bestTimes[curTrack]);
      }
      beep(660, 0.3); setTimeout(() => beep(880, 0.4), 180);
    }
    // arcade initials entry when the time makes the top 10
    if (state === "done" && !entryHandled && stateT > 1.0) {
      entryHandled = true;
      if (lbQualifies(curTrack, cars[0].finishTime)) openEntry(cars[0].finishTime);
    }
  } else {
    for (const w of HZ.windmills) w.ang += w.om * dt;   // idle spin behind menu
  }
  for (const sp of splashes) sp.t -= dt;
  splashes = splashes.filter(sp => sp.t > 0);

  if (engineGain) {
    const spd = Math.hypot(cars[0].vx, cars[0].vy);
    engineOsc.frequency.value = 55 + spd * 0.28;
    engineGain.gain.value = racing && !paused ? 0.035 + spd * 0.00002 : 0;
  }

  // camera: follow player (or hover over the course in the menu)
  const p = cars[0];
  const spd = Math.hypot(p.vx, p.vy);
  let tx, ty, tz;
  if (state === "menu" || state === "board") {
    tx = WORLD_W / 2; ty = WORLD_H / 2;
    tz = Math.max(W / WORLD_W, H / WORLD_H) * 1.02;
  } else {
    tx = p.x + p.vx * 0.30; ty = p.y + p.vy * 0.30;
    tz = clamp(1.28 - spd * 0.00055, 0.85, 1.28) * Math.min(W / 1100, 1.4);
  }
  cam.x += (tx - cam.x) * Math.min(1, dt * 5);
  cam.y += (ty - cam.y) * Math.min(1, dt * 5);
  cam.zoom += (tz - cam.zoom) * Math.min(1, dt * 2);
  const vw = W / (2 * cam.zoom), vh = H / (2 * cam.zoom);
  if (vw * 2 < WORLD_W) cam.x = clamp(cam.x, vw, WORLD_W - vw); else cam.x = WORLD_W / 2;
  if (vh * 2 < WORLD_H) cam.y = clamp(cam.y, vh, WORLD_H - vh); else cam.y = WORLD_H / 2;

  // --- render ---
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#20160c";
  ctx.fillRect(0, 0, W, H);
  ctx.setTransform(DPR * cam.zoom, 0, 0, DPR * cam.zoom,
                   DPR * (W / 2 - cam.x * cam.zoom), DPR * (H / 2 - cam.y * cam.zoom));
  ctx.drawImage(world, 0, 0);

  for (const sp of splashes) {
    ctx.strokeStyle = `rgba(220,240,255,${sp.t * 1.6})`;
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(sp.x, sp.y, (0.5 - sp.t) * 110 + 12, 0, 7); ctx.stroke();
  }
  drawMachine();
  const order = [...cars].sort((a, b) => (a.air > 0 ? 1 : 0) - (b.air > 0 ? 1 : 0) || a.progress - b.progress);
  for (const car of order) drawCar(car);
  drawWindmills();

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  uiButtons = [];
  if (state === "menu") drawMenu();
  else if (state === "board") drawBoard();
  else {
    drawHUD();
    if (IS_TOUCH) drawTouchControls();
  }
}
requestAnimationFrame(frame);

function drawCar(car) {
  const alpha = car.respawn > 0 ? clamp(Math.abs(car.respawn - 0.35) * 4, 0.1, 1) : 1;
  const hop = car.air > 0 ? Math.sin((1 - car.air / AIR_TIME) * Math.PI) : 0;
  const scale = 1 + hop * 0.4;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(car.x, car.y);
  ctx.fillStyle = "rgba(0,0,0,0.30)";
  ctx.beginPath();
  ctx.ellipse(3 + hop * 14, 5 + hop * 18, 20 * (1 - hop * 0.3), 14 * (1 - hop * 0.3), 0, 0, 7);
  ctx.fill();
  ctx.scale(scale, scale);
  ctx.rotate(car.angle);
  ctx.fillStyle = "#1c1c1c";
  for (const [wx, wy] of [[-11,-10],[-11,10],[11,-10],[11,10]]) ctx.fillRect(wx - 4, wy - 3, 8, 6);
  ctx.fillStyle = car.color;
  ctx.beginPath();
  ctx.moveTo(-17, -8); ctx.lineTo(12, -9); ctx.lineTo(18, -4);
  ctx.lineTo(18, 4);  ctx.lineTo(12, 9);  ctx.lineTo(-17, 8);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.45)"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = car.roof; ctx.fillRect(-10, -6, 14, 12);
  ctx.fillStyle = "#223"; ctx.fillRect(4, -6, 4, 12);
  ctx.restore();
  if (!car.ai && state === "race") {
    ctx.save();
    ctx.translate(car.x, car.y - 30 - hop * 20);
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.beginPath(); ctx.moveTo(-7, -8); ctx.lineTo(7, -8); ctx.lineTo(0, 2); ctx.fill();
    ctx.restore();
  }
}

function drawMachine() {
  const M = HZ.machine;
  if (!M) return;
  const run = M.state === "run";
  // pressure pad glow while armed
  if (!run) {
    ctx.strokeStyle = `rgba(255,230,120,${0.4 + Math.sin(performance.now() * 0.004) * 0.25})`;
    ctx.lineWidth = 5;
    ctx.strokeRect(M.pad.x - 3, M.pad.y - 3, M.pad.w + 6, M.pad.h + 6);
  }
  // dominoes
  for (let i = 0; i < M.dominoes.length; i++) {
    const d = M.dominoes[i];
    const tf = MT.dom0 + i * MT.domDt;
    let p = 0;   // 0 standing, 1 flat
    if (run) {
      if (M.t > MT.reset) p = clamp(1 - (M.t - MT.reset - i * 0.05) / 0.5, 0, 1);
      else p = clamp((M.t - tf) / 0.25, 0, 1);
    }
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.ang);
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fillRect(-5 + p * 3, 3, 10 + p * 22, 8);
    ctx.fillStyle = p > 0.5 ? "#d8d8d0" : "#f4f4ec";
    ctx.fillRect(-5, -13 + p * 9, 10 + p * 24, 26 - p * 16);
    ctx.strokeStyle = "#888"; ctx.lineWidth = 1.5;
    ctx.strokeRect(-5, -13 + p * 9, 10 + p * 24, 26 - p * 16);
    ctx.restore();
  }
  // seesaw plank (+ waiting ball before launch)
  const tip = run ? clamp((M.t - MT.seesaw) / 0.25, 0, M.t > MT.reset ? 0 : 1) : 0;
  ctx.save();
  ctx.translate(M.seesaw.x, M.seesaw.y);
  ctx.rotate(-0.5 - tip * 0.5);
  ctx.fillStyle = "#8a5f35";
  ctx.fillRect(-52, -7, 104, 14);
  ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.lineWidth = 2;
  ctx.strokeRect(-52, -7, 104, 14);
  ctx.restore();
  // bowling ball: waiting, flying, rolling, or sunk
  const b = ballPos(M);
  const showWaiting = !run || M.t < MT.launch || M.t > MT.reset + 0.6;
  if (b || showWaiting) {
    const bx = b ? b.x : M.seesaw.x - 34, by = b ? b.y : M.seesaw.y - 30;
    const hop = b ? b.hop : 0;
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath(); ctx.ellipse(bx + hop * 12, by + 8 + hop * 22, 24 * (1 - hop * 0.3), 12, 0, 0, 7); ctx.fill();
    const s = 1 + hop * 0.5;
    ctx.fillStyle = "#252530";
    ctx.beginPath(); ctx.arc(bx, by - hop * 30, 26 * s, 0, 7); ctx.fill();
    ctx.fillStyle = "#3a3a4a";
    ctx.beginPath(); ctx.arc(bx - 7 * s, by - hop * 30 - 8 * s, 12 * s, 0, 7); ctx.fill();
    ctx.fillStyle = "#111";
    for (const [hx, hy] of [[-4, -2], [5, -6], [6, 3]]) {
      ctx.beginPath(); ctx.arc(bx + hx * s, by - hop * 30 + hy * s, 3.4 * s, 0, 7); ctx.fill();
    }
  }
  // sprinkler burst
  if (sprinklerOn(M)) {
    ctx.fillStyle = "rgba(120,180,255,0.13)";
    ctx.beginPath(); ctx.arc(M.spr.x, M.spr.y, M.spr.r, 0, 7); ctx.fill();
    for (let j = 0; j < 3; j++) {
      const base = M.spr.ang + j * (Math.PI * 2 / 3);
      for (let k = 1; k <= 6; k++) {
        const rr = (k / 6) * M.spr.r;
        const a = base - k * 0.09;
        ctx.fillStyle = `rgba(170,215,255,${0.85 - k * 0.11})`;
        ctx.beginPath();
        ctx.arc(M.spr.x + Math.cos(a) * rr, M.spr.y + Math.sin(a) * rr, 4.5 - k * 0.4, 0, 7);
        ctx.fill();
      }
    }
  }
}

function drawWindmills() {
  for (const w of HZ.windmills) {
    // hut
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.beginPath(); ctx.ellipse(w.x + 5, w.y + 8, 40, 30, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#c9552e";
    ctx.beginPath(); ctx.arc(w.x, w.y, 34, 0, 7); ctx.fill();
    ctx.fillStyle = "#a03e1e";
    ctx.beginPath(); ctx.arc(w.x, w.y, 34, -0.6, 2.5); ctx.fill();
    // blades
    for (let k = 0; k < 4; k++) {
      const a = w.ang + k * Math.PI / 2;
      ctx.save();
      ctx.translate(w.x, w.y); ctx.rotate(a);
      ctx.fillStyle = "rgba(0,0,0,0.18)";
      ctx.fillRect(w.hubR - 2, -w.armW / 2 + 6, w.len - w.hubR, w.armW);
      ctx.fillStyle = "#f0e6d2";
      ctx.fillRect(w.hubR - 2, -w.armW / 2, w.len - w.hubR, w.armW);
      ctx.strokeStyle = "#8a5f35"; ctx.lineWidth = 3;
      ctx.strokeRect(w.hubR - 2, -w.armW / 2, w.len - w.hubR, w.armW);
      ctx.restore();
    }
    ctx.fillStyle = "#6b4a2a";
    ctx.beginPath(); ctx.arc(w.x, w.y, w.hubR * 0.55, 0, 7); ctx.fill();
  }
}

function fmtTime(t) {
  const m = Math.floor(t / 60), s = t % 60;
  return `${m}:${s.toFixed(2).padStart(5, "0")}`;
}

function button(x, y, w, h, fn) {
  uiButtons.push({ x, y, w, h, fn });
  ctx.fillStyle = "rgba(255,255,255,0.12)";
  roundRect(x, y, w, h, 14); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.45)"; ctx.lineWidth = 2;
  roundRect(x, y, w, h, 14); ctx.stroke();
}

function drawMenu() {
  ctx.fillStyle = "rgba(15,25,15,0.55)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(0,0,0,0.5)";
  ctx.font = "bold 58px Arial, sans-serif";
  ctx.fillText("MICRO RACERS", W / 2 + 3, H * 0.18 + 3);
  ctx.fillStyle = "#ffd75e";
  ctx.fillText("MICRO RACERS", W / 2, H * 0.18);
  // difficulty selector
  const bw = Math.min(W * 0.8, 420), bh = 86;
  const dw = (bw - 24) / 3, dh = 44, dy = H * 0.36 - dh - 26;
  ctx.font = "14px Arial, sans-serif"; ctx.fillStyle = "rgba(255,255,255,0.75)";
  ctx.fillText("AI DIFFICULTY", W / 2, dy - 14);
  DIFFS.forEach((d, i) => {
    const dx = W / 2 - bw / 2 + i * (dw + 12);
    uiButtons.push({ x: dx, y: dy, w: dw, h: dh, fn: () => setDifficulty(i) });
    ctx.fillStyle = i === difficulty ? "rgba(255,215,94,0.30)" : "rgba(255,255,255,0.10)";
    roundRect(dx, dy, dw, dh, 10); ctx.fill();
    ctx.strokeStyle = i === difficulty ? "#ffd75e" : "rgba(255,255,255,0.35)";
    ctx.lineWidth = 2;
    roundRect(dx, dy, dw, dh, 10); ctx.stroke();
    ctx.fillStyle = i === difficulty ? "#ffd75e" : "rgba(255,255,255,0.85)";
    ctx.font = "bold 17px Arial, sans-serif";
    ctx.fillText(d.name, dx + dw / 2, dy + dh / 2 + 1);
  });

  TRACKS.forEach((t, i) => {
    const bx = W / 2 - bw / 2, by = H * 0.36 + i * (bh + 22);
    button(bx, by, bw, bh, () => startRace(i));
    ctx.fillStyle = "#fff"; ctx.font = "bold 26px Arial, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(`${i + 1}. ${t.name}`, bx + 24, by + 30);
    ctx.font = "16px Arial, sans-serif"; ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.fillText(t.blurb, bx + 24, by + 58);
    if (bestTimes[i]) {
      ctx.textAlign = "right"; ctx.fillStyle = "#ffd75e";
      ctx.fillText(`best ${fmtTime(bestTimes[i])}`, bx + bw - 20, by + 58);
    }
    ctx.textAlign = "center";
  });
  const ly = H * 0.36 + TRACKS.length * (bh + 22);
  button(W / 2 - bw / 2, ly, bw, 52, () => { boardTab = curTrack; state = "board"; lbFetch(); });
  ctx.fillStyle = "#ffd75e"; ctx.font = "bold 20px Arial, sans-serif";
  ctx.fillText("🏆 LEADERBOARD", W / 2, ly + 27);

  ctx.font = "16px Arial, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.fillText(IS_TOUCH ? "tap a track to start" : "click or press 1‑3 · L leaderboard · D difficulty · N returns here",
               W / 2, ly + 74);
}

function drawHUD() {
  const p = cars[0];
  const standings = [...cars].sort((a, b) => {
    if (a.finished && b.finished) return a.finishTime - b.finishTime;
    if (a.finished !== b.finished) return a.finished ? -1 : 1;
    return b.progress - a.progress;
  });
  const pos = standings.indexOf(p) + 1;

  ctx.font = "bold 34px Arial, sans-serif";
  ctx.textAlign = "left"; ctx.textBaseline = "top";
  ctx.fillStyle = "rgba(0,0,0,0.45)";
  roundRect(12, 12, 210, 92, 12); ctx.fill();
  ctx.fillStyle = "#fff";
  const suffix = ["st","nd","rd","th"][Math.min(pos - 1, 3)];
  ctx.fillText(`${pos}${suffix}`, 26, 20);
  ctx.font = "bold 22px Arial, sans-serif";
  ctx.fillStyle = "#ffd75e";
  ctx.fillText(`LAP ${clamp(p.lap, 1, 3)}/3`, 26, 66);
  for (let i = 0; i < standings.length; i++) {
    ctx.fillStyle = standings[i].color;
    ctx.beginPath(); ctx.arc(150 + (i % 2) * 30, 34 + Math.floor(i / 2) * 26, 8, 0, 7); ctx.fill();
    if (!standings[i].ai) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.stroke(); }
  }

  ctx.fillStyle = "rgba(0,0,0,0.45)";
  roundRect(W - 190, 12, 178, 46, 12); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.font = "bold 26px Consolas, monospace";
  ctx.textAlign = "right";
  ctx.fillText(fmtTime(Math.max(raceTime, 0)), W - 26, 22);

  if (!IS_TOUCH || W > 700) drawMinimap();

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  if (state === "count") {
    const n = 3 - Math.floor(stateT);
    ctx.font = "bold 130px Arial, sans-serif";
    ctx.fillStyle = "rgba(0,0,0,0.5)";
    ctx.fillText(n > 0 ? String(n) : "GO!", W / 2 + 4, H / 2 - 56);
    ctx.fillStyle = n > 0 ? "#ffd75e" : "#7fe07f";
    ctx.fillText(n > 0 ? String(n) : "GO!", W / 2, H / 2 - 60);
    ctx.font = "18px Arial, sans-serif"; ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.fillText(IS_TOUCH ? "Buttons to drive · 3 laps" : "Arrows / WASD to drive · Space = handbrake · 3 laps", W / 2, H / 2 + 30);
    if (curTrack === 1) ctx.fillText("Hit the ramp fast to clear the water!", W / 2, H / 2 + 56);
    if (curTrack === 2) ctx.fillText("The yellow pad starts the machine…", W / 2, H / 2 + 56);
  } else if (state === "race" && stateT < 1.2) {
    ctx.globalAlpha = 1 - stateT / 1.2;
    ctx.font = "bold 130px Arial, sans-serif"; ctx.fillStyle = "#7fe07f";
    ctx.fillText("GO!", W / 2, H / 2 - 60);
    ctx.globalAlpha = 1;
  }
  if (paused) {
    ctx.font = "bold 60px Arial, sans-serif"; ctx.fillStyle = "#fff";
    ctx.fillText("PAUSED", W / 2, H / 2);
  }
  if (state === "done") {
    ctx.fillStyle = "rgba(0,0,0,0.65)";
    roundRect(W / 2 - 230, H / 2 - 180, 460, 380, 18); ctx.fill();
    ctx.fillStyle = pos === 1 ? "#ffd75e" : "#fff";
    ctx.font = "bold 44px Arial, sans-serif";
    ctx.fillText(pos === 1 ? "🏆 YOU WIN!" : `${pos}${suffix} PLACE`, W / 2, H / 2 - 135);
    ctx.font = "15px Arial, sans-serif"; ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.fillText(`${TRACKS[curTrack].name} · ${DIFFS[difficulty].name}`, W / 2, H / 2 - 104);
    ctx.font = "22px Arial, sans-serif";
    for (let i = 0; i < standings.length; i++) {
      const c = standings[i];
      ctx.fillStyle = c.color;
      ctx.beginPath(); ctx.arc(W / 2 - 150, H / 2 - 80 + i * 38, 9, 0, 7); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.textAlign = "left";
      ctx.fillText(`${i + 1}. ${c.name}`, W / 2 - 128, H / 2 - 80 + i * 38);
      ctx.textAlign = "right";
      ctx.fillText(c.finished ? fmtTime(c.finishTime) : "racing…", W / 2 + 180, H / 2 - 80 + i * 38);
      ctx.textAlign = "center";
    }
    if (bestTimes[curTrack]) {
      ctx.fillStyle = "#ffd75e"; ctx.font = "18px Arial, sans-serif";
      ctx.fillText(`Best: ${fmtTime(bestTimes[curTrack])}`, W / 2, H / 2 + 82);
    }
    const bw = 190, bh = 52;
    button(W / 2 - bw - 10, H / 2 + 118, bw, bh, () => startRace(curTrack));
    button(W / 2 + 10, H / 2 + 118, bw, bh, () => { state = "menu"; });
    ctx.fillStyle = "#fff"; ctx.font = "bold 20px Arial, sans-serif";
    ctx.fillText(IS_TOUCH ? "REMATCH" : "REMATCH (R)", W / 2 - bw / 2 - 10, H / 2 + 144);
    ctx.fillText(IS_TOUCH ? "TRACKS" : "TRACKS (N)", W / 2 + bw / 2 + 10, H / 2 + 144);
  }
}

function drawBoard() {
  ctx.fillStyle = "rgba(10,18,10,0.72)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#ffd75e"; ctx.font = "bold 36px Arial, sans-serif";
  ctx.fillText("🏆 TOP 10", W / 2, 44);

  // track tabs
  const tw = Math.min((W - 60) / 3, 190), th = 40, ty = 84;
  TRACKS.forEach((t, i) => {
    const tx = W / 2 + (i - 1) * (tw + 10) - tw / 2;
    uiButtons.push({ x: tx, y: ty, w: tw, h: th, fn: () => { boardTab = i; } });
    ctx.fillStyle = i === boardTab ? "rgba(255,215,94,0.30)" : "rgba(255,255,255,0.10)";
    roundRect(tx, ty, tw, th, 10); ctx.fill();
    ctx.strokeStyle = i === boardTab ? "#ffd75e" : "rgba(255,255,255,0.3)"; ctx.lineWidth = 2;
    roundRect(tx, ty, tw, th, 10); ctx.stroke();
    ctx.fillStyle = i === boardTab ? "#ffd75e" : "rgba(255,255,255,0.8)";
    ctx.font = `bold ${W < 620 ? 12 : 15}px Arial, sans-serif`;
    ctx.fillText(t.name.toUpperCase(), tx + tw / 2, ty + th / 2 + 1);
  });

  const list = (lbBoards()[boardTab] || []);
  const rowH = Math.min(38, (H - 260) / 10);
  ctx.font = `bold ${Math.min(22, rowH * 0.62)}px Consolas, monospace`;
  for (let i = 0; i < 10; i++) {
    const y = 158 + i * rowH;
    const e = list[i];
    const mine = e && lbHighlight && e.n === lbHighlight.n && e.c === lbHighlight.c &&
                 Math.abs(e.t - lbHighlight.t) < 0.005 && boardTab === lbHighlight.track;
    if (mine) {
      ctx.fillStyle = "rgba(255,215,94,0.22)";
      roundRect(W / 2 - 210, y - rowH / 2 + 2, 420, rowH - 4, 8); ctx.fill();
    }
    ctx.fillStyle = e ? (mine ? "#ffd75e" : "#fff") : "rgba(255,255,255,0.25)";
    ctx.textAlign = "right";
    ctx.fillText(`${i + 1}.`, W / 2 - 155, y);
    if (e) {
      ctx.textAlign = "center";
      ctx.fillText(flagEmoji(e.c || "AU"), W / 2 - 110, y);
      ctx.textAlign = "left";
      ctx.fillText(e.n, W / 2 - 60, y);
      ctx.textAlign = "right";
      ctx.fillText(fmtTime(e.t), W / 2 + 185, y);
    } else {
      ctx.textAlign = "left";
      ctx.fillText("---", W / 2 - 60, y);
      ctx.textAlign = "right";
      ctx.fillText("-:--.--", W / 2 + 185, y);
    }
  }

  ctx.textAlign = "center";
  ctx.font = "14px Arial, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  const status = !LB_URL ? "local scores on this device · global board coming soon"
    : lbSaving ? "saving…"
    : lbOnline ? "global · live" : "offline — showing last known scores";
  ctx.fillText(status, W / 2, 158 + 10 * rowH + 12);

  const bw2 = 170, bh2 = 48, by2 = 158 + 10 * rowH + 34;
  button(W / 2 - bw2 / 2, by2, bw2, bh2, () => { state = "menu"; });
  ctx.fillStyle = "#fff"; ctx.font = "bold 18px Arial, sans-serif";
  ctx.fillText(IS_TOUCH ? "BACK" : "BACK (N)", W / 2, by2 + bh2 / 2 + 1);
}

function drawMinimap() {
  const mw = 200, mh = 150, mx = 14, my = H - mh - 14;
  const sc = Math.min(mw / WORLD_W, mh / WORLD_H) * 0.92;
  ctx.fillStyle = "rgba(0,0,0,0.40)";
  roundRect(mx, my, mw, mh, 10); ctx.fill();
  ctx.save();
  ctx.translate(mx + mw / 2 - WORLD_W * sc / 2, my + mh / 2 - WORLD_H * sc / 2);
  ctx.scale(sc, sc);
  ctx.strokeStyle = "rgba(255,255,255,0.55)";
  ctx.lineWidth = HALF_W * 1.4; ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(SAMPLES[0].x, SAMPLES[0].y);
  for (let i = 2; i < N_S; i += 2) ctx.lineTo(SAMPLES[i].x, SAMPLES[i].y);
  ctx.closePath(); ctx.stroke();
  for (const car of cars) {
    ctx.fillStyle = car.color;
    ctx.beginPath(); ctx.arc(car.x, car.y, car.ai ? 34 : 46, 0, 7); ctx.fill();
    if (!car.ai) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 12; ctx.stroke(); }
  }
  ctx.restore();
}

function drawTouchControls() {
  const z = touchZones();
  for (const k in z) {
    const r = z[k];
    ctx.fillStyle = touchState[k] ? "rgba(255,255,255,0.45)" : "rgba(255,255,255,0.18)";
    roundRect(r.x, r.y, r.w, r.h, 14); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.font = `bold ${r.h * 0.5}px Arial, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(r.label, r.x + r.w / 2, r.y + r.h / 2 + 2);
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
