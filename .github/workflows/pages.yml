name: Deploy to GitHub Pages

# Publishes the game by syncing this branch to gh-pages, which GitHub
# Pages serves at https://thedaddyg.github.io/Microm/

on:
  push:
    branches: [claude/micro-machines-clone-251y32]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: '.github'
